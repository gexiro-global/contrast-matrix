[build-system]
requires = ["setuptools>=68,<84", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-matrix"
version = "0.1.1"
description = "CI-first WCAG contrast matrix checking for design tokens."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Gexiro Global Enterprises Ltd"}]
keywords = ["wcag", "accessibility", "contrast", "design-tokens", "ci"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.urls]
Homepage = "https://github.com/gexiro-global/contrast-matrix"
Repository = "https://github.com/gexiro-global/contrast-matrix"

[project.scripts]
contrast-matrix = "contrast_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contrast_matrix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
