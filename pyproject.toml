[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-matrix"
version = "0.1.0"
description = "CI-first WCAG contrast matrix checking for design tokens."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Gexiro Global Enterprises Ltd"}]
keywords = ["wcag", "accessibility", "contrast", "design-tokens", "ci"]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.urls]
Homepage = "https://github.com/gexiro-global/contrast-matrix"
Repository = "https://github.com/gexiro-global/contrast-matrix"

[project.scripts]
contrast-matrix = "contrast_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
